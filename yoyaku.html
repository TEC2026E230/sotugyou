<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約画面</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="yoyaku.css">
</head>
<body>
    <h1 id="title">模擬店　商品予約</h1>
    <div class="sentaku">
        <h3>店舗選択</h3>
        <form action="" method="post">
            <select name="shop" id="shop-select" class="shop-select">
                <option value="yakisoba">焼きそば</option>
                <option value="popcorn">ポップコーン</option>
                <option value="hamburger">ハンバーガー</option>
                <option value="takoyaki">たこ焼き</option>
            </select>
            
            <h3>メニュー選択</h3>
            <div id="menu">
            </div>

            <div class="form-group">
                <h3>受け取り時間選択</h3>
                <select name="timeslot" id="time-slot-select" class="shop-select">
                    <option value="1">10:30</option>
                    <option value="2">11:00</option>
                    <option value="3">12:00</option>
                    <option value="4">12:30</option>
                    <option value="4">13:00</option>
                    <option value="4">13:30</option>
                    <option value="4">14:00</option>
                    <option value="4">14:30</option>
                    <option value="4">15:00</option>
                    <option value="4">15:30</option>
                    <option value="4">15:00</option>
                </select>
                <div class="form-group">
                    <button type="button" id="kakutei-btn" onclick="confirm()">予約内容を確認する</button>
                </div>
            </div>
        </form>
    </div>
    

    <script src="yoyaku.js"></script>
</body>
</html>
